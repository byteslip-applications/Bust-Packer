[package]
name = "bustpacker"
version = "0.1.0"
edition = "2021"
description = "Bust Packer - Business Source License Protected Tool"
license = "LicenseRef-BSL-1.1"

[dependencies]
egui = { version = "0.31", default-features = false }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
